<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; background: #0b0b14; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

const rawData = {
  "gemini.google.com": 688,
  "cineb.sx": 114,
  "www.youtube.com": 211,
  "trello.com": 606,
  "archive.org": 3,
  "github.com": 614,
  "discord.com": 3068,
  "www.messenger.com": 5,
  "duckduckgo.com": 12,
  "vercel.com": 5,
  "basia-portfolio-pi.vercel.app": 2,
  "welib.org": 1
};

function getDomainHue(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = str.charCodeAt(i) + ((hash << 5) - hash);
  }
  return Math.abs(hash) % 360;
}

const MIN_RADIUS = 4;
const MAX_RADIUS = 70;
const times = Object.values(rawData);
const maxTime = Math.max(...times);

const planets = [];
const entries = Object.entries(rawData);

entries.sort((a, b) => b[1] - a[1]);

entries.forEach(([domain, timeSpent], index) => {
  const radius = MIN_RADIUS + Math.sqrt(timeSpent / maxTime) * (MAX_RADIUS - MIN_RADIUS);
  const mass = radius * radius; // Masa proporcjonalna do pola powierzchni

  const phi = index * 137.5 * (Math.PI / 180); // Złoty kąt
  const distance = (radius + 10) * Math.sqrt(index) + 30;

  const targetX = width / 2 + Math.cos(phi) * distance;
  const targetY = height / 2 + Math.sin(phi) * distance;

  planets.push({
    name: domain,
    time: timeSpent,
    radius: radius,
    mass: mass,
    hue: getDomainHue(domain),
    x: targetX + (Math.random() - 0.5) * 40,
    y: targetY + (Math.random() - 0.5) * 40,
    vx: 0,
    vy: 0,
    targetX: targetX,
    targetY: targetY
  });
});

let animTime = 0;

function animate() {
  ctx.fillStyle = 'rgba(11, 11, 20, 0.25)';
  ctx.fillRect(0, 0, width, height);
  animTime += 0.008;

  for (let i = 0; i < planets.length; i++) {
    let p = planets[i];

    let dx = p.targetX - p.x;
    let dy = p.targetY - p.y;
    let dist = Math.hypot(dx, dy);
    
    if (dist > 0.1) {
      let force = dist * 0.001;
      p.vx += (dx / dist) * force;
      p.vy += (dy / dist) * force;
    }

    let noise = Math.sin(p.x * 0.003 + animTime) + Math.cos(p.y * 0.003 + animTime);
    p.vx += Math.cos(noise) * 0.08;
    p.vy += Math.sin(noise) * 0.08;

    for (let j = i + 1; j < planets.length; j++) {
      let p2 = planets[j];
      let pdx = p2.x - p.x;
      let pdy = p2.y - p.y;
      let pDist = Math.hypot(pdx, pdy);
      
      let minDist = p.radius + p2.radius + 6; 

      if (pDist < minDist && pDist > 0) {
        let overlap = minDist - pDist;
        let nx = pdx / pDist;
        let ny = pdy / pDist;

        let totalMass = p.mass + p2.mass;
        let force = overlap * 0.08;

        p.vx -= nx * force * (p2.mass / totalMass);
        p.vy -= ny * force * (p2.mass / totalMass);
        p2.vx += nx * force * (p.mass / totalMass);
        p2.vy += ny * force * (p.mass / totalMass);
      }
    }

    p.vx *= 0.90;
    p.vy *= 0.90;

    p.x += p.vx;
    p.y += p.vy;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);

    let grad = ctx.createRadialGradient(
      p.x - p.radius * 0.3, p.y - p.radius * 0.3, p.radius * 0.1,
      p.x, p.y, p.radius
    );
    grad.addColorStop(0, `hsl(${p.hue}, 90%, 75%)`);
    grad.addColorStop(1, `hsl(${p.hue}, 70%, 40%)`);

    ctx.fillStyle = grad;
    ctx.shadowBlur = p.radius * 0.8;
    ctx.shadowColor = `hsl(${p.hue}, 80%, 55%)`;
    ctx.fill();
    ctx.shadowBlur = 0;

    if (p.radius > 15) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      ctx.font = `${Math.min(p.radius * 0.35, 12)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(p.name.replace('www.', ''), p.x, p.y);
    }
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
