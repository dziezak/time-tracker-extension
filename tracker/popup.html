<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      color: #333;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      text-align: center;
    }
    .top-list {
      list-style: none;
      padding: 0;
      margin: 0 0 12px 0;
    }
    .top-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: #f4f4f6;
      border-radius: 6px;
      font-size: 12px;
    }
    .domain {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 150px;
    }
    .time {
      color: #666;
      font-variant-numeric: tabular-nums;
    }
    .empty-msg {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin: 15px 0;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    button {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: #f0f0f0;
    }
    #status {
      font-size: 11px;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h3>Top 5 Stron</h3>
  <ul id="topList" class="top-list"></ul>
  
  <div class="btn-group">
    <button id="exportBtn">Eksportuj JSON</button>
    <button id="resetBtn">Resetuj</button>
  </div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
