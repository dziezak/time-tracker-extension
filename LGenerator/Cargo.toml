[package]
name = "LGenerator"
version = "0.1.0"
edition = "2024"

[dependencies]
# Rendering 3D (Vulkan / Metal)
wgpu = "0.19"
winit = "0.29"
bytemuck = { version = "1.14", features = ["derive"] }

# Matematyka 3D i Macierze
glam = "0.24"

# Parsowanie danych
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Zapisywanie klatek i obsługa asynchroniczna
image = "0.24"
tokio = { version = "1.35", features = ["full"] }
pollster = "1.0.1"
lsystem = "0.2.1"
